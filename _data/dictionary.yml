# 词典词条数据库 —— 由用户维护
# 每个词条包含：title（标题，理论上唯一）、meanings(数组，每一条都是结构化的：
#   - pronunciation（可选，拼音/读音）：以标签形式展示在 wordClass 上一行
#   - wordClass（可选）：用标签形式，动词展示"动"，名词展示"名"，形容词展示"形"，副词展示"副"
#   - borrowedAs（可选，通假/借字）：以标签形式展示在 wordClass 下一行
#   - explanation（可选）：再下一行展示
#   - bookRefs（可选，数组）：每一个展示一行，第一行前展示标签“援例”
#       bookRefs 的一个对象包含 bookName 和 content，展示形式为 'content —— 《bookName》'
#       preview 为可选，有则在 hover 时展示，注意 preview 可以是 html 段，需要作为 html 渲染
#       link 也为可选，如果存在，该行可以作为超链接点击，不以超链接的样式显示
#   - synonym（可选，同义词数组）：bookRefs 下方展示，单行展示，行首为标签(文本为'义近')
#       每个元素按顺序展示为标签，文本为 synonymName
#       如果有 preview 属性，和 bookRefs 的 preview 展示逻辑相同（包含 app 端逻辑）
#       如果没有 preview，但 synonymName 也是词条，悬浮显示该词条的卡片（卡片内容与网页词条卡片一致，但不带链接与 hover，仅可查看）
#       另外，如果 synonymName 也是词条，可以作为超链接点击，在新页面将 synonymName 作为 keyword 搜索
# 新增词条：复制下面任意一项，改掉内容即可；搜索时会匹配 title。
- title: "臻"
  meanings:
    - explanation: 至，到
      wordClass: 动词
      bookRefs:
        - bookName: 说文
          content: 臻，至也
        - bookName: 尔雅·释诂
          content: 迄、臻、极...，至也。
          preview: 迄、臻、极、到、赴、来、吊、艐、格、戾、怀、摧、詹，<b>至也</b>。
          link: https://erya.5000yan.com/1005.html
  tags:
    - 尔雅
- title: "荐"
  meanings:
    - explanation: 本意，草席
      pronunciation: jiàn
      wordClass: 名词
      bookRefs:
        - bookName: 说文
          content: 凡亲地者谓之筵，加于筵者谓之席。席即因也，重于筵也。
    - explanation: 再，重，接连，因为席加于筵之上，所以引申出重的意思
      wordClass: 副词
      borrowedAs: 洊
      bookRefs:
        - bookName: 国语·鲁语上
          content: 饥馑荐降
          preview: 五谷不熟为饥，蔬菜不熟为馑
    - explanation: 进献，无酒肉作祭品的祭礼称作荐，引申出进献的意思
      wordClass: 动词
      bookRefs:
        - bookName: 梁书·袁昂传
          content: 未遑荐璧
      synonym:
        - synonymName: 珍
          preview: 献物曰珍
        - synonymName: 享
          preview: 献食曰享
        - synonymName: 臻
    - explanation: 推荐人才，介绍，即所献之物为人
      wordClass: 动词
      bookRefs:
         - bookName: 孟子·万章上
           content: 昔者，尧荐舜于天，而天受之
