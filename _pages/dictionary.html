<p>在下方搜索框中输入关键字，可实时筛选标题包含该关键字的词条。</p>

<div class="dict-search">
  <input type="search" id="dict-input" placeholder="搜索词条标题…" autocomplete="off" />
  <p class="dict-hint" id="dict-count" aria-live="polite"></p>
  <ul id="dict-results" class="dict-list"></ul>
</div>

<link rel="stylesheet" href="{{ '/assets/css/dictionary.css' | relative_url }}">

<script>
  // 词条数据由 Jekyll 从 _data/dictionary.yml 注入
  // 使用 replace 过滤器防止 script 等字符截断脚本
  window.DICTIONARY_DATA = {{ site.data.dictionary | jsonify | replace: "</", "<\/" }};
</script>
<script src="{{ '/assets/js/dictionary.js' | relative_url }}"></script>
